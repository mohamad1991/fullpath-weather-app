# Run via scripts/test-alerts.sh, which renders ${db_instances}=2 first.
rule_files:
  - database.rules.rendered.yaml
evaluation_interval: 1m

tests:
  - name: total outage - every instance's series disappears
    interval: 1m
    input_series:
      - series: 'cnpg_collector_up{namespace="weather",pod="weather-db-1"}'
        values: '1x3 _x10'
      - series: 'cnpg_collector_up{namespace="weather",pod="weather-db-2"}'
        values: '1x3 _x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: WeatherDBInstanceDown
        exp_alerts:
          - exp_labels: { severity: critical, team: weather }
            exp_annotations:
              summary: A Postgres instance is down
              runbook_url: https://github.com/mohamad1991/fullpath-weather-app/blob/main/docs/runbooks/WeatherDBInstanceDown.md

  - name: one replica lost
    interval: 1m
    input_series:
      - series: 'cnpg_collector_up{namespace="weather",pod="weather-db-1"}'
        values: '1x12'
      - series: 'cnpg_collector_up{namespace="weather",pod="weather-db-2"}'
        values: '1x3 _x10'
    alert_rule_test:
      - eval_time: 12m
        alertname: WeatherDBInstanceDown
        exp_alerts:
          - exp_labels: { severity: critical, team: weather }
            exp_annotations:
              summary: A Postgres instance is down
              runbook_url: https://github.com/mohamad1991/fullpath-weather-app/blob/main/docs/runbooks/WeatherDBInstanceDown.md

  - name: healthy cluster stays quiet
    interval: 1m
    input_series:
      - series: 'cnpg_collector_up{namespace="weather",pod="weather-db-1"}'
        values: '1x12'
      - series: 'cnpg_collector_up{namespace="weather",pod="weather-db-2"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 12m
        alertname: WeatherDBInstanceDown
        exp_alerts: []
