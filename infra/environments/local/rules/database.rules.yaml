# CloudNativePG alerts (local DB backend only; on AWS the DB is RDS, covered by
# CloudWatch alarms in modules/database). Plain Prometheus format so promtool can
# unit-test it; Terraform fills ${db_instances} and wraps it in a PrometheusRule.
groups:
  - name: weather-db.alerts
    rules:
      - alert: WeatherDBInstanceDown
        # `or vector(0)`: if ALL instances are gone there are no series, count() is empty
        # (not 0) and a plain `count(...) < N` never fires. Found in a live outage drill
        # where only WeatherAPIUnavailable fired.
        expr: |
          cnpg_collector_up{namespace="weather"} == 0
          or
          (count(cnpg_collector_up{namespace="weather"}) or vector(0)) < ${db_instances}
        for: 2m
        labels:
          severity: critical
          team: weather
        annotations:
          summary: A Postgres instance is down
          runbook_url: https://github.com/mohamad1991/fullpath-weather-app/blob/main/docs/runbooks/WeatherDBInstanceDown.md
      - alert: WeatherDBReplicationLag
        expr: max(cnpg_pg_replication_lag{namespace="weather"}) > 30
        for: 5m
        labels:
          severity: warning
          team: weather
        annotations:
          summary: 'Postgres replica is {{ $value }}s behind - a failover now would lose data'
          runbook_url: https://github.com/mohamad1991/fullpath-weather-app/blob/main/docs/runbooks/WeatherDBReplicationLag.md
