# Argo CD Application for the weather app in dev. Lives in Git: changing how the app
# is deployed is a reviewed PR, not a click in the UI.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:mohamad1991/fullpath-weather-app.git # must match the repo credential URL
    targetRevision: main
    path: deploy/charts/weather
    helm:
      valueFiles: [../../environments/dev/values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: weather # created by Terraform with Pod Security labels
  syncPolicy:
    automated:
      prune: true     # resources removed from Git are removed from the cluster
      selfHeal: true  # manual kubectl edits are reverted -> Git stays the source of truth
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
  # HPA owns replicas; don't fight it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
