{{- if .Values.database.externalSecret.enabled }}
# Syncs DB credentials from AWS Secrets Manager (RDS-managed credentials secret +
# Terraform-written connection secret) into a k8s Secret. No credentials in Git;
# rotation is picked up via refreshInterval.
# Hook with a lower weight than the migrations Job, so the Secret exists before it runs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  labels: {{- include "weather.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.database.externalSecret.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.database.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
  # Keys from all sources are merged: the RDS-managed secret gives username/password,
  # the Terraform-written connection secret gives host/port/dbname.
  dataFrom:
    {{- range required "database.externalSecret.remoteKeys is required" .Values.database.externalSecret.remoteKeys }}
    - extract:
        key: {{ . }}
    {{- end }}
{{- end }}
