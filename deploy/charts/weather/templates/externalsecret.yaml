{{- if .Values.database.externalSecret.enabled }}
# Syncs DB credentials from AWS Secrets Manager (written there by Terraform / RDS-managed
# secret) into a k8s Secret. No credentials in Git, rotation handled by refreshInterval.
# Hook with a lower weight than the migrations Job, so the Secret exists before it runs.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.secretName }}
  labels: {{- include "weather.labels" (dict "ctx" $ "component" "database") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.database.externalSecret.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.database.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.database.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "database.externalSecret.remoteKey is required" .Values.database.externalSecret.remoteKey }}
{{- end }}
