{{- if .Values.frontend.enabled }}
{{- $ctx := dict "ctx" $ "component" "frontend" }}
{{- $name := printf "%s-frontend" (include "weather.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }
  selector:
    matchLabels: {{- include "weather.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "weather.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "weather.podSecurityContext" . | nindent 8 }}
        runAsUser: 101   # nginx-unprivileged
        runAsGroup: 101
      terminationGracePeriodSeconds: 30
      {{- include "weather.topologySpread" $ctx | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "weather.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.frontend.port }} }
          env:
            # Only used if a request reaches nginx's /api proxy; the Ingress normally
            # routes /api straight to the API Service.
            - name: API_UPSTREAM
              value: http://{{ include "weather.fullname" . }}-api
          securityContext: {{- include "weather.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
          volumeMounts:
            # readOnlyRootFilesystem: nginx needs writable pid/cache (/tmp) and the
            # entrypoint renders the config template into conf.d.
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: nginx-conf
          emptyDir: { sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "weather.selectorLabels" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.frontend.pdb.maxUnavailable }}
  selector:
    matchLabels: {{- include "weather.selectorLabels" $ctx | nindent 6 }}
{{- if .Values.frontend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.frontend.autoscaling.targetCPUUtilizationPercentage }} }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
{{- end }}
{{- end }}
