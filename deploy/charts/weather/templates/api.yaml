{{- if .Values.api.enabled }}
{{- $ctx := dict "ctx" $ "component" "api" }}
{{- $name := printf "%s-api" (include "weather.fullname" .) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false  # the app never talks to the k8s API
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 25%, maxUnavailable: 0 }  # never drop below desired capacity
  selector:
    matchLabels: {{- include "weather.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "weather.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- include "weather.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      terminationGracePeriodSeconds: 30
      {{- include "weather.topologySpread" $ctx | nindent 6 }}
      containers:
        - name: api
          image: {{ include "weather.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ .Values.api.port }} }
          env:
            {{- include "weather.dbEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.api.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          securityContext: {{- include "weather.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:   # process only - a DB outage must not restart every pod
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:  # DB reachable - otherwise pull the pod out of the Service
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Give the ingress/ALB time to deregister the pod before SIGTERM,
            # so in-flight and newly-routed requests aren't dropped during rollouts.
            preStop:
              exec: { command: ["sleep", "10"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "weather.selectorLabels" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.api.pdb.maxUnavailable }}
  selector:
    matchLabels: {{- include "weather.selectorLabels" $ctx | nindent 6 }}
{{- if .Values.api.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels: {{- include "weather.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }} }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # avoid flapping
{{- end }}
{{- end }}
