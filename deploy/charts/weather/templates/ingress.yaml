{{- if .Values.ingress.enabled }}
{{- $fullname := include "weather.fullname" . }}
# Path-based routing: one host, /api -> API, everything else -> frontend.
# Same origin = no CORS configuration needed and one TLS certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels: {{- include "weather.labels" (dict "ctx" $ "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ $fullname }}-frontend, port: { name: http } }
{{- end }}
