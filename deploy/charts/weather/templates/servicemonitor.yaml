{{- if and .Values.serviceMonitor.enabled .Values.api.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "weather.fullname" . }}-api
  labels: {{- include "weather.labels" (dict "ctx" $ "component" "api") | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "weather.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
