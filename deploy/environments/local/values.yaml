# Local kind cluster (infra/environments/local). Images from GHCR.
image:
  registry: ghcr.io/mohamad1991/fullpath-weather-app
  tag: 8c2665bdaa7391c417aa0db289cc4a81f97a852c # bumped automatically by CI on every merge to main
imagePullSecrets:
  - name: ghcr-pull # created by Terraform (infra/environments/local)
database:
  secretName: weather-db-app # generated by CloudNativePG
serviceMonitor:
  enabled: true
prometheusRule:
  enabled: true
grafanaDashboard:
  enabled: true
